services:
  ezfin:
    build: .
    # Bound to loopback on the host on purpose. Do not change to "8787:8787".
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Scheduled syncs (default 05:23 and 17:35) use this time zone.
      TZ: America/New_York
      # Ollama running on the host machine. Keep Ollama bound to localhost on the host.
      EZFIN_AI_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ezfin-data:/data
    restart: unless-stopped

volumes:
  ezfin-data:
